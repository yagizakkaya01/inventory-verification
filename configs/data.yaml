# Ultralytics dataset config (YOLO format).
# Paths are relative to this repo root (Ultralytics resolves against `path`).
#
# Class names are FUNCTIONAL / NEUTRAL on purpose — they describe the role in
# the verification task, not the physical object. Adjust once objects are fixed.

path: data/datasets/inventory
train: images/train
val: images/val
test: images/test

names:
  0: item_a
  1: item_b
  2: item_c
