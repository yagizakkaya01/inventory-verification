# Runtime pipeline + state-logic config. Consumed by src/pipeline/run.py.

source:
  type: oakd             # webcam | oakd | astra | video
  index: 0               # webcam index, or path for `video` (ignored for oakd)
  width: 1280
  height: 720
  fps: 30
  # NOTE: OAK-D currently links at USB2 speed. The oakd source requests NV12,
  # which holds 1280x720@30 anyway. Use the USB3 cable/port before enabling
  # depth (stereo adds bandwidth).

detection:
  weights: models/checkpoints/inventory-yolo11s/weights/best.pt
  conf: 0.35
  iou: 0.6
  imgsz: 640
  device: 0

# Temporal smoothing: a detection state must hold for `window` consecutive
# frames (with at least `min_agree` agreeing) before it is accepted.
smoothing:
  window: 8
  min_agree: 6

# Expected scene definition. The verifier compares the smoothed observation
# against this and emits OK / MISSING / WRONG_ORDER / WRONG_COMBINATION.
expected:
  # ordered left-to-right by object centroid x (the "ok" layout)
  sequence: [tufek, tabanca, sarjor]
  # tolerance for "same row" grouping, fraction of frame height
  row_tolerance: 0.15

output:
  draw: true             # overlay boxes + verdict
  log_path: runs/pipeline.log
