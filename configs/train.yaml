# Training hyperparameters for the detection model.
# Consumed by src/detection/train.py. Mirrors Ultralytics arg names.

model: yolo11s.pt          # pretrained base for transfer learning
data: configs/data.yaml
epochs: 200
imgsz: 640
batch: 16                  # lower if GPU OOM
patience: 50               # early-stop patience
device: 0                  # 0 = first GPU, 'cpu' to force CPU
workers: 8
seed: 42
cos_lr: true
project: models/checkpoints
name: inventory-yolo11s

# Augmentation — scene is a fixed camera, so keep geometry mild but vary
# lighting/color aggressively. Occlusion handled via mosaic + real data.
hsv_h: 0.02
hsv_s: 0.7
hsv_v: 0.5
degrees: 8.0
translate: 0.12
scale: 0.4
shear: 2.0
perspective: 0.0003
fliplr: 0.0               # left/right flip changes "order" semantics — keep off
flipud: 0.0
mosaic: 1.0
mixup: 0.1
close_mosaic: 25
