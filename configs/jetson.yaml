# Runtime pipeline config for Jetson Nano (JetPack 4.6.4, TensorRT FP16).
# Consumed by src/pipeline/run_jetson.py (NOT by run.py).

source:
  type: oakd
  index: 0
  width: 1280
  height: 720
  fps: 30

detection:
  # TensorRT engine built on the Jetson via trtexec (FP16)
  weights: models/checkpoints/inventory-yolo11s/weights/best.engine
  conf: 0.30
  iou: 0.6
  imgsz: 640
  device: 0

smoothing:
  window: 8
  min_agree: 6

expected:
  sequence: [tufek, tabanca, sarjor]
  row_tolerance: 0.15

output:
  draw: true
  log_path: runs/pipeline_jetson.log
